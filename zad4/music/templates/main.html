<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>

    {%load static%}
    <link rel="stylesheet" href="{%static "music/main.css"%}"/>
</head>
<body>
    <h1>Music!</h1>
    <p>This website is about music. Check below to see music!</p>

    <button id="buttonLoadData">Load Data</button>
    <select id="selectFilter">
        <option value="artist">Artist</option>
        <option value="album">Album</option>
        <option value="title">Title</option>
    </select>
    <input id="inputText" type="text" placeholder="Filter text here, leave empty if not desired"></input>

    <label id="komunikat">Załaduj dane przyciskiem.</label>

    <ul id="dataList">
        
    </ul>
    

    <script>
        const label = document.getElementById("komunikat");

        const loadButton = document.getElementById('buttonLoadData');
        const dataList = document.getElementById('dataList');

        const selectFilter = document.getElementById('selectFilter');
        const inputText = document.getElementById('inputText');


        loadButton.addEventListener('click', async () => {
            try {
                label.textContent = "Ładowanie danych...";

                const selectedFilter = selectFilter.value;
                const inputFilter = inputText.value;

                let response = "";

                if (inputFilter != "") {
                    console.log("ladowanie filter i input: " + selectedFilter + " " + inputFilter);
                    response = await fetch(`/api/music/?${selectedFilter}=${inputFilter}`);
                } else {
                    console.log("Ladowanie BEZ");
                    response = await fetch(`/api/music/`);
                }

                if (!response.ok) {
                    label.textContent = "Pojawil sie blad przy ladowaniu danych.";
                    throw new Error("Byl blad w fetchowaniu danych");
                }

                const data = await response.json();

                dataList.innerHTML = "";

                if (data.length==0) {
                    label.textContent = "Brak danych w bazie!";
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement("li");
                    //li.innerHTML =`${item.id}, "${item.title}" <ul><li>Title: ${item.title}</li><li>Album: ${item.album}</li><li>Artist: ${item.artist}</li><li>Plays: ${item.plays}</li><li>Release Date: ${item.released}</li></ul>`;
                    li.innerHTML = `<h2>${item.title}</h2><p>Album: \"${item.album}\" | Artist: ${item.artist} | Released on: ${item.released} | Listens: ${item.plays}</p>`;

                    dataList.appendChild(li);
                });

                label.textContent = "Zaladowano dane z bazy danych, dodano do listy.";
            } catch(error) {
                console.error("Nie udano sie zaladowac danych: ", error);
                label.textContent = "Pojawil sie blad przy ladowaniu danych. Blad: "+error;
            }
            

            
        });

        
    </script>
</body>
</html>
